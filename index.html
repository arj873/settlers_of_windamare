<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy (docs/MULTIPLAYER.md §12). Scripts, styles, fonts, workers and
      sockets come from this origin only; a future HTML-injection bug cannot load or run foreign
      code. 'unsafe-inline' styles: Vite's dev HMR and the SVG icons' style="fill:…" attributes.
      data: images/fonts/media: inlined assets, avatars and Pixi's format probes. blob: images and
      workers: the avatar uploader and Pixi's decode workers. When the Worker runs on another
      origin (VITE_ROOM_SERVER), vite.config.ts adds it to the sockets directive at build time.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colonizers of Windamere</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 28,9 28,23 16,30 4,23 4,9' fill='%23e8b04a' stroke='%237a4a1c' stroke-width='2'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0f2a44;
      }
      #app {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
