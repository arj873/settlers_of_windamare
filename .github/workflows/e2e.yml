# Gate (typecheck, lint, unit tests) plus the 2-tab online e2e on the in-browser dev server.
# Untested on GitHub itself: e2e:online uses /usr/bin/google-chrome-stable, which the
# ubuntu-latest runners ship.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm e2e:online
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-online-shots
          path: playtest/shots/e2e-online
          if-no-files-found: ignore
