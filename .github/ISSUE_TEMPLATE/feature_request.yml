name: Feature request
description: Suggest a new feature or an improvement.
labels: ['enhancement']
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should the game do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve, or what would be better?
  - type: dropdown
    id: mode
    attributes:
      label: Which mode does it apply to?
      options:
        - All modes
        - Base game
        - Seafarers
        - Cities & Knights
        - Traders & Barbarians
        - Online play
        - Other
